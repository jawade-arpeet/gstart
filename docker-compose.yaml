name: "gstart"

services:
    postgres:
        image: "postgres:18-alpine"
        container_name: "gstart-postgres"
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: "username"
            POSTGRES_PASSWORD: "password"
            POSTGRES_DB: "gstart-db"
        volumes:
            - "postgres_data:/var/lib/postgresql"
        networks:
            - gstart-network
    redis:
        image: "redis:8-alpine"
        container_name: "gstart-redis"
        ports:
            - "6379:6379"
        command: "redis-server --requirepass password --appendonly yes"
        restart: unless-stopped
        networks:
            - gstart-network

volumes:
    postgres_data:
        name: gstart-postgres-volume

networks:
    gstart-network:
        name: gstart-network
        driver: bridge
